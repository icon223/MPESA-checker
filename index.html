<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Expense Tracker & Refund Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1116; color: #f5f7fb; }
    .bg-gradient-main { background: radial-gradient(circle at 18% -8%, rgba(80, 102, 231, 0.12) 0%, transparent 34%), radial-gradient(circle at 78% 0%, rgba(72, 196, 134, 0.08) 0%, transparent 32%), linear-gradient(135deg, #111317 0%, #090b0f 55%, #12151a 100%); }
    .glass-card { background: rgba(39, 43, 51, 0.86); backdrop-filter: blur(12px); border: 1px solid rgba(126, 137, 159, 0.32); }
    .glass-card-soft { background: rgba(31, 35, 43, 0.86); border: 1px solid rgba(126, 137, 159, 0.2); }
    .panel-strong { background: linear-gradient(145deg, rgba(43, 48, 57, 0.94), rgba(30, 34, 42, 0.94)); border: 1px solid rgba(126, 137, 159, 0.32); }
    .btn-primary { background: linear-gradient(180deg, #5b6df0 0%, #4054d7 100%); }
    .btn-primary:hover { background: linear-gradient(180deg, #6b7df5 0%, #5064e7 100%); }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .anim-fade-in { animation: fadeIn 0.25s ease-out; }
    .anim-slide-up { animation: slideUp 0.3s ease-out; }
    .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    input, select, textarea { background: rgba(20, 23, 29, 0.72) !important; border: 1px solid rgba(126, 137, 159, 0.3) !important; color: #f5f7fb !important; border-radius: 10px !important; }
    input:focus, select:focus, textarea:focus { outline: none !important; border-color: #5b6df0 !important; box-shadow: 0 0 0 3px rgba(91, 109, 240, 0.2) !important; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pill { border-radius: 6px; padding: 0.2rem 0.5rem; font-size: 0.7rem; text-transform: uppercase; background: rgba(141, 150, 169, 0.16); color: #c5cad4; }
    .pill-red { background: rgba(228, 103, 103, 0.16); color: #f19191; }
    .pill-green { background: rgba(72, 196, 134, 0.16); color: #6ee3a1; }
    .status-active { display: inline-flex; align-items: center; border-radius: 999px; padding: 0.2rem 0.6rem; background: rgba(72, 196, 134, 0.22); color: #7ee6ac; font-size: 0.75rem; }
    .status-inactive { display: inline-flex; align-items: center; border-radius: 999px; padding: 0.2rem 0.6rem; background: rgba(141, 150, 169, 0.16); color: #c5cad4; font-size: 0.75rem; }
  </style>
</head>
<body>

<div x-data="appState()" class="min-h-screen bg-gradient-main" :class="{'overflow-hidden h-screen fixed inset-0': showAddSubModal || showIngestModal}">

  <!-- ===== AUTH SCREEN ===== -->
  <template x-if="!token">
    <div class="min-h-screen flex items-center justify-center p-4" style="background: radial-gradient(ellipse at 50% 0%, rgba(91, 109, 240, 0.08) 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, rgba(72, 196, 134, 0.05) 0%, transparent 60%), #0f1116;">
      <div class="w-full max-w-sm">
        <div class="text-center mb-6">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#5b6df0] to-[#4054d7] flex items-center justify-center mx-auto mb-4 shadow-xl shadow-[#5b6df0]/25">
            <i data-lucide="wallet" class="w-8 h-8 text-white"></i>
          </div>
          <h1 class="text-2xl font-bold text-white tracking-tight">Expense Tracker</h1>
          <p class="text-sm text-gray-400 mt-0.5">Track expenses, subscriptions &amp; refunds</p>
        </div>

        <div class="panel-strong rounded-2xl p-6 shadow-2xl shadow-black/30">
          <template x-if="authTab === 'login'">
            <div class="space-y-3.5">
              <h2 class="text-lg font-bold text-center text-white">Welcome Back</h2>
              <p class="text-xs text-gray-400 text-center -mt-1.5">Sign in to your account</p>
              <div><label class="text-xs font-medium text-gray-400 block mb-1">Username</label><input type="text" x-model="authForm.username" placeholder="Enter username" class="w-full px-4 py-2.5 text-sm"></div>
              <div><label class="text-xs font-medium text-gray-400 block mb-1">Password</label><input type="password" x-model="authForm.password" placeholder="Enter password" class="w-full px-4 py-2.5 text-sm"></div>
              <div x-show="authError" class="text-xs text-red-400 bg-red-500/10 rounded-lg px-3 py-2" x-text="authError"></div>
              <button @click="login" :disabled="!authForm.username || !authForm.password" class="w-full py-2.5 rounded-xl text-sm font-bold text-white btn-primary transition disabled:opacity-40">Sign In</button>

              <!-- Google Sign-In -->
              <div class="relative my-2">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
                <div class="relative flex justify-center text-[10px]"><span class="px-3 text-gray-500 bg-[#1a1d24]">or continue with</span></div>
              </div>
              <button @click="googleSignIn" class="w-full py-2.5 rounded-xl text-sm font-semibold text-gray-300 border border-white/20 hover:bg-white/5 transition flex items-center justify-center gap-2.5">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                <span>Sign in with Google</span>
              </button>

              <p class="text-xs text-gray-500 text-center">Don't have an account? <button @click="authTab = 'register'; authError = ''" class="text-[#5b6df0] font-semibold hover:underline">Create one</button></p>
              <p class="text-[10px] text-gray-600 text-center">Demo: <span class="font-mono text-gray-500">demo / demo123</span></p>
            </div>
          </template>
          <template x-if="authTab === 'register'">
            <div class="space-y-3.5">
              <h2 class="text-lg font-bold text-center text-white">Get Started</h2>
              <p class="text-xs text-gray-400 text-center -mt-1.5">Create a new account</p>
              <div><label class="text-xs font-medium text-gray-400 block mb-1">Username</label><input type="text" x-model="authForm.username" placeholder="Choose a username" class="w-full px-4 py-2.5 text-sm"></div>
              <div><label class="text-xs font-medium text-gray-400 block mb-1">Password</label><input type="password" x-model="authForm.password" placeholder="Choose a password (6+ chars)" class="w-full px-4 py-2.5 text-sm"></div>
              <div><label class="text-xs font-medium text-gray-400 block mb-1">Confirm Password</label><input type="password" x-model="authForm.confirm" placeholder="Confirm password" class="w-full px-4 py-2.5 text-sm"></div>
              <div x-show="authError" class="text-xs text-red-400 bg-red-500/10 rounded-lg px-3 py-2" x-text="authError"></div>
              <button @click="register" :disabled="!authForm.username || !authForm.password || !authForm.confirm" class="w-full py-2.5 rounded-xl text-sm font-bold text-white btn-primary transition disabled:opacity-40">Create Account</button>

              <div class="relative my-2">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
                <div class="relative flex justify-center text-[10px]"><span class="px-3 text-gray-500 bg-[#1a1d24]">or sign up with</span></div>
              </div>
              <button @click="googleSignIn" class="w-full py-2.5 rounded-xl text-sm font-semibold text-gray-300 border border-white/20 hover:bg-white/5 transition flex items-center justify-center gap-2.5">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                <span>Sign up with Google</span>
              </button>

              <p class="text-xs text-gray-500 text-center">Already have an account? <button @click="authTab = 'login'; authError = ''" class="text-[#5b6df0] font-semibold hover:underline">Sign in</button></p>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== DASHBOARD ===== -->
  <template x-if="token">
    <div class="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-6">

      <!-- Header -->
      <div class="flex items-center justify-between mb-4 sm:mb-6">
        <div>
          <h1 class="text-lg sm:text-2xl font-bold text-white tracking-tight">Expense Tracker</h1>
          <p class="text-xs sm:text-sm text-gray-400">Signed in as <span class="text-gray-300 font-semibold" x-text="username"></span></p>
        </div>
        <div class="flex items-center gap-3">
          <button @click="refreshData" class="p-2 rounded-lg glass-card hover:bg-white/5 transition" title="Refresh">
            <i data-lucide="refresh-cw" class="w-4 h-4 text-gray-400" :class="{'animate-spin': loading}"></i>
          </button>
          <button @click="logout" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-red-400 border border-red-500/30 hover:bg-red-500/10 transition">Sign Out</button>
        </div>
      </div>

      <!-- Error Banner -->
      <div x-show="apiError" class="glass-card border border-red-500/30 rounded-xl px-4 py-3 mb-4 flex items-start gap-3">
        <i data-lucide="alert-circle" class="w-5 h-5 text-red-400 shrink-0 mt-0.5"></i>
        <div class="text-xs text-red-300 flex-1" x-text="apiError"></div>
        <button @click="apiError = ''" class="text-red-400 hover:text-red-300"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <!-- Summary Metrics -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 sm:gap-3 mb-4 sm:mb-6">
        <div class="glass-card rounded-xl p-3 sm:p-4">
          <div class="flex items-center justify-between text-xs text-gray-400"><span>Transactions</span><span class="pill">Total</span></div>
          <div class="text-xl sm:text-2xl font-semibold text-white mt-1" x-text="summary.transaction_count">—</div>
        </div>
        <div class="glass-card rounded-xl p-3 sm:p-4" style="border-bottom-color: rgba(228, 103, 103, 0.5); box-shadow: inset 0 -3px 0 rgba(228, 103, 103, 0.5);">
          <div class="flex items-center justify-between text-xs text-gray-400"><span>Debits</span><span class="pill pill-red">Debits</span></div>
          <div class="text-xl sm:text-2xl font-semibold text-white mt-1" x-text="'KES ' + formatNum(summary.total_debits)">—</div>
        </div>
        <div class="glass-card rounded-xl p-3 sm:p-4" style="border-bottom-color: rgba(72, 196, 134, 0.5); box-shadow: inset 0 -3px 0 rgba(72, 196, 134, 0.5);">
          <div class="flex items-center justify-between text-xs text-gray-400"><span>Credits</span><span class="pill pill-green">Credits</span></div>
          <div class="text-xl sm:text-2xl font-semibold text-white mt-1" x-text="'KES ' + formatNum(summary.total_credits)">—</div>
        </div>
        <div class="glass-card rounded-xl p-3 sm:p-4">
          <div class="flex items-center justify-between text-xs text-gray-400"><span>Pending Refunds</span></div>
          <div class="text-xl sm:text-2xl font-semibold text-white mt-1" x-text="summary.pending_refunds">—</div>
        </div>
        <div class="glass-card rounded-xl p-3 sm:p-4">
          <div class="flex items-center justify-between text-xs text-gray-400"><span>30-Day Runway</span><span class="pill pill-green">Runway</span></div>
          <div class="text-xl sm:text-2xl font-semibold text-white mt-1" x-text="'KES ' + formatNum(summary.next_30_day_subscription_total)">—</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex gap-1 mb-4 border-b border-white/10 overflow-x-auto hide-scrollbar">
        <template x-for="tab in tabs" :key="tab.id">
          <button @click="activeTab = tab.id" class="px-3 sm:px-4 py-2.5 text-xs sm:text-sm font-semibold whitespace-nowrap transition border-b-2 -mb-px" :class="activeTab === tab.id ? 'text-[#5b6df0] border-[#5b6df0]' : 'text-gray-500 border-transparent hover:text-gray-300'"><span x-text="tab.label"></span></button>
        </template>
      </div>

      <!-- ===== TAB: Transactions ===== -->
      <template x-if="activeTab === 'transactions'">
        <div class="space-y-4">
          <div class="flex flex-wrap gap-2">
            <input type="text" x-model="txnSearch" placeholder="Search merchant or reference..." class="flex-1 min-w-[180px] px-3 py-2 text-xs">
            <select x-model="txnDirection" class="px-3 py-2 text-xs min-w-[100px]"><option value="">All directions</option><option value="debit">Debit</option><option value="credit">Credit</option></select>
            <select x-model="txnStatus" class="px-3 py-2 text-xs min-w-[100px]"><option value="">All statuses</option><option value="completed">Completed</option><option value="pending">Pending</option><option value="refund_initiated">Refund Initiated</option></select>
          </div>
          <div class="glass-card-soft rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-xs sm:text-sm">
                <thead><tr class="text-gray-400 border-b border-white/5">
                  <th class="text-left px-3 py-2.5 font-medium">Date</th>
                  <th class="text-left px-3 py-2.5 font-medium">Merchant</th>
                  <th class="text-right px-3 py-2.5 font-medium">Amount</th>
                  <th class="text-center px-3 py-2.5 font-medium">Direction</th>
                  <th class="text-center px-3 py-2.5 font-medium">Status</th>
                  <th class="text-left px-3 py-2.5 font-medium hidden sm:table-cell">Reference</th>
                  <th class="text-center px-3 py-2.5 font-medium">Action</th>
                </tr></thead>
                <tbody>
                  <template x-for="txn in filteredTransactions" :key="txn.id">
                    <tr class="border-b border-white/5 hover:bg-white/[0.02] transition">
                      <td class="px-3 py-2.5 text-gray-300 whitespace-nowrap" x-text="txn.transaction_date"></td>
                      <td class="px-3 py-2.5 text-white font-medium" x-text="txn.merchant"></td>
                      <td class="px-3 py-2.5 text-right font-semibold" :class="txn.direction === 'debit' ? 'text-red-400' : 'text-green-400'" x-text="txn.currency + ' ' + formatNum(txn.amount)"></td>
                      <td class="px-3 py-2.5 text-center"><span class="pill" :class="txn.direction === 'debit' ? 'pill-red' : 'pill-green'" x-text="txn.direction"></span></td>
                      <td class="px-3 py-2.5 text-center"><span class="text-xs" :class="txn.status === 'completed' ? 'text-green-400' : txn.status === 'refund_initiated' ? 'text-amber-400' : 'text-gray-400'" x-text="txn.status"></span></td>
                      <td class="px-3 py-2.5 text-gray-400 font-mono text-[10px] hidden sm:table-cell max-w-[120px] truncate" x-text="txn.reference || '—'"></td>
                      <td class="px-3 py-2.5 text-center">
                        <button x-show="txn.direction === 'debit' && txn.status !== 'refund_initiated'" @click="markRefund(txn.id)" class="text-[10px] font-semibold text-amber-400 hover:text-amber-300 transition">Refund</button>
                        <span x-show="txn.direction !== 'debit' || txn.status === 'refund_initiated'" class="text-[10px] text-gray-500">—</span>
                      </td>
                    </tr>
                  </template>
                  <tr x-show="filteredTransactions.length === 0"><td colspan="7" class="px-3 py-8 text-center text-gray-500 text-sm">No transactions found</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>

      <!-- ===== TAB: Subscriptions ===== -->
      <template x-if="activeTab === 'subscriptions'">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="lg:col-span-2 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold text-white">Active Subscriptions</h3>
              <button @click="showAddSubModal = true" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white btn-primary transition">+ Add</button>
            </div>
            <template x-if="runway.length === 0 && subscriptions.length === 0">
              <div class="glass-card-soft rounded-xl p-6 text-center">
                <i data-lucide="credit-card" class="w-8 h-8 text-gray-500 mx-auto mb-2"></i>
                <p class="text-sm text-gray-400">No subscriptions yet. Add one to start tracking.</p>
              </div>
            </template>
            <div class="space-y-2">
              <template x-for="sub in subscriptions" :key="sub.id">
                <div class="glass-card rounded-xl px-3 sm:px-4 py-3 flex items-center justify-between">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold shrink-0" :style="'background: ' + (sub.active ? 'rgba(72,196,134,0.15)' : 'rgba(141,150,169,0.15)')" :class="sub.active ? 'text-green-400' : 'text-gray-500'"><span x-text="sub.name.substring(0,2).toUpperCase()"></span></div>
                    <div class="min-w-0">
                      <div class="text-sm font-semibold text-white truncate" x-text="sub.name"></div>
                      <div class="text-xs text-gray-400">Billing day: <span class="text-gray-300" x-text="ordinal(sub.billing_day)"></span></div>
                    </div>
                  </div>
                  <div class="text-right shrink-0 ml-3">
                    <div class="text-sm font-bold text-white" x-text="sub.currency + ' ' + formatNum(sub.amount)"></div>
                    <span class="text-xs" :class="sub.active ? 'status-active' : 'status-inactive'" x-text="sub.active ? 'Active' : 'Paused'"></span>
                  </div>
                </div>
              </template>
            </div>
            <template x-if="runway.length > 0">
              <div>
                <h3 class="text-sm font-bold text-white mb-2 mt-4">Due in Next 30 Days</h3>
                <div class="space-y-2">
                  <template x-for="item in runway" :key="item.id">
                    <div class="glass-card rounded-xl px-3 sm:px-4 py-3 flex items-center justify-between border-l-2 border-l-[#5b6df0]">
                      <div>
                        <div class="text-sm font-semibold text-white" x-text="item.name"></div>
                        <div class="text-xs text-gray-400">Due <span class="text-gray-300" x-text="item.due_date"></span></div>
                      </div>
                      <div class="text-right">
                        <div class="text-sm font-bold text-white" x-text="item.currency + ' ' + formatNum(item.amount)"></div>
                        <div class="text-[10px] text-gray-500" x-text="'~KES ' + formatNum(item.estimated_local_amount)"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
          <div class="glass-card rounded-xl p-4 h-fit">
            <h3 class="text-sm font-bold text-white mb-3">Add Subscription</h3>
            <form @submit.prevent="addSubscription" class="space-y-3">
              <div><label class="text-xs font-medium text-gray-400 block mb-1">Name</label><input type="text" x-model="subForm.name" placeholder="e.g. Netflix" class="w-full px-3 py-2 text-sm"></div>
              <div><label class="text-xs font-medium text-gray-400 block mb-1">Amount</label><input type="number" x-model="subForm.amount" placeholder="0.00" min="0" step="0.01" class="w-full px-3 py-2 text-sm"></div>
              <div><label class="text-xs font-medium text-gray-400 block mb-1">Currency</label><select x-model="subForm.currency" class="w-full px-3 py-2 text-sm"><option value="KES">KES</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option></select></div>
              <div><label class="text-xs font-medium text-gray-400 block mb-1">Billing Day (1-31)</label><input type="number" x-model="subForm.billing_day" min="1" max="31" class="w-full px-3 py-2 text-sm"></div>
              <div><label class="text-xs font-medium text-gray-400 block mb-1">FX Rate to KES</label><input type="number" x-model="subForm.fx_rate" value="1" min="0" step="0.01" class="w-full px-3 py-2 text-sm"></div>
              <button type="submit" :disabled="!subForm.name || !subForm.amount" class="w-full py-2.5 rounded-xl text-sm font-bold text-white btn-primary transition disabled:opacity-40">Add Subscription</button>
            </form>
          </div>
        </div>
      </template>

      <!-- ===== TAB: Refunds ===== -->
      <template x-if="activeTab === 'refunds'">
        <div class="space-y-4">
          <h3 class="text-sm font-bold text-white">Refund Watchlist</h3>
          <template x-if="refunds.length === 0">
            <div class="glass-card-soft rounded-xl p-6 text-center">
              <i data-lucide="rotate-ccw" class="w-8 h-8 text-gray-500 mx-auto mb-2"></i>
              <p class="text-sm text-gray-400">No refund items being tracked.</p>
            </div>
          </template>
          <div class="space-y-2">
            <template x-for="refund in refunds" :key="refund.id">
              <div class="glass-card rounded-xl px-3 sm:px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-8 h-8 rounded-lg flex items-center justify-center bg-amber-500/10 shrink-0"><i data-lucide="rotate-ccw" class="w-4 h-4 text-amber-400"></i></div>
                  <div class="min-w-0">
                    <div class="text-sm font-semibold text-white truncate" x-text="refund.merchant"></div>
                    <div class="text-xs text-gray-400" x-text="refund.currency + ' ' + formatNum(refund.amount) + ' — ' + (refund.status || 'pending')"></div>
                  </div>
                </div>
                <div class="text-right shrink-0 ml-3">
                  <span class="text-xs" :class="refund.status === 'settled' ? 'status-active' : 'text-amber-400 font-semibold'" x-text="refund.status"></span>
                  <div x-show="refund.expected_by" class="text-[10px] text-gray-500 mt-0.5">Expected by <span x-text="refund.expected_by"></span></div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===== TAB: Parse Alert ===== -->
      <template x-if="activeTab === 'parse'">
        <div class="max-w-2xl space-y-4">
          <h3 class="text-sm font-bold text-white">Preview Alert Parsing</h3>
          <p class="text-xs text-gray-400">Paste an M-PESA SMS or email alert to see how it will be parsed before saving.</p>
          <textarea x-model="parseText" placeholder="Paste raw alert text here..." class="w-full px-4 py-3 text-sm rounded-xl" rows="5"></textarea>
          <button @click="previewParse" :disabled="!parseText.trim()" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white btn-primary transition disabled:opacity-40">Preview Parse</button>
          <div x-show="parseResult" class="glass-card rounded-xl p-4">
            <pre class="text-xs text-gray-300 overflow-x-auto" x-text="JSON.stringify(parseResult, null, 2)"></pre>
          </div>
          <div x-show="parseError" class="text-xs text-red-400 bg-red-500/10 rounded-lg px-3 py-2" x-text="parseError"></div>
        </div>
      </template>

      <!-- ===== TAB: Ingest Alert ===== -->
      <template x-if="activeTab === 'ingest'">
        <div class="max-w-2xl space-y-4">
          <h3 class="text-sm font-bold text-white">Ingest Alert</h3>
          <p class="text-xs text-gray-400">Paste an M-PESA SMS or email alert to parse and save it to the transaction log.</p>
          <textarea x-model="ingestText" placeholder="Paste raw alert text here..." class="w-full px-4 py-3 text-sm rounded-xl" rows="5"></textarea>
          <button @click="ingestAlert" :disabled="!ingestText.trim() || ingesting" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white btn-primary transition disabled:opacity-40">
            <span x-text="ingesting ? 'Saving...' : 'Parse & Save'"></span>
          </button>
          <div x-show="ingestResult" class="glass-card rounded-xl p-4">
            <div class="flex items-center gap-2 text-green-400 text-sm font-semibold mb-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Saved successfully</div>
            <pre class="text-xs text-gray-300 overflow-x-auto" x-text="JSON.stringify(ingestResult, null, 2)"></pre>
          </div>
          <div x-show="ingestError" class="text-xs text-red-400 bg-red-500/10 rounded-lg px-3 py-2" x-text="ingestError"></div>
        </div>
      </template>

    </div>
  </template>

  <!-- ===== ADD SUBSCRIPTION MODAL ===== -->
  <template x-if="showAddSubModal">
    <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center modal-overlay" @click.self="showAddSubModal = false">
      <div class="bg-[#1a1d24] rounded-t-2xl sm:rounded-2xl w-full max-w-md shadow-2xl anim-slide-up border border-white/10" @click.stop>
        <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-white/10">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center bg-[#5b6df0]/10"><i data-lucide="credit-card" class="w-5 h-5 text-[#5b6df0]"></i></div>
            <div><div class="font-bold text-white text-sm">Add Subscription</div><div class="text-[10px] text-gray-400">Track a new recurring expense</div></div>
          </div>
          <button @click="showAddSubModal = false" class="p-1.5 hover:bg-white/10 rounded-full transition"><i data-lucide="x" class="w-5 h-5 text-gray-400"></i></button>
        </div>
        <form @submit.prevent="addSubscriptionFromModal" class="p-5 space-y-3">
          <div><label class="text-xs font-medium text-gray-400 block mb-1">Name</label><input type="text" x-model="subForm.name" placeholder="e.g. Netflix" class="w-full px-3 py-2.5 text-sm"></div>
          <div><label class="text-xs font-medium text-gray-400 block mb-1">Amount</label><input type="number" x-model="subForm.amount" placeholder="0.00" min="0" step="0.01" class="w-full px-3 py-2.5 text-sm"></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="text-xs font-medium text-gray-400 block mb-1">Currency</label><select x-model="subForm.currency" class="w-full px-3 py-2.5 text-sm"><option value="KES">KES</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option></select></div>
            <div><label class="text-xs font-medium text-gray-400 block mb-1">Billing Day</label><input type="number" x-model="subForm.billing_day" min="1" max="31" class="w-full px-3 py-2.5 text-sm"></div>
          </div>
          <div><label class="text-xs font-medium text-gray-400 block mb-1">FX Rate to KES (optional)</label><input type="number" x-model="subForm.fx_rate" min="0" step="0.01" class="w-full px-3 py-2.5 text-sm"></div>
          <button type="submit" :disabled="!subForm.name || !subForm.amount" class="w-full py-3 rounded-xl text-sm font-bold text-white btn-primary transition disabled:opacity-40">Add to Tracker</button>
        </form>
      </div>
    </div>
  </template>

</div>

<script>
function appState() {
  return {
    API_URL: 'http://127.0.0.1:8000',
    token: localStorage.getItem('token') || '',
    username: localStorage.getItem('username') || '',
    loading: false,
    apiError: '',
    authTab: 'login',
    authForm: { username: '', password: '', confirm: '' },
    authError: '',

    tabs: [
      { id: 'transactions', label: 'Transactions' },
      { id: 'subscriptions', label: 'Subscriptions' },
      { id: 'refunds', label: 'Refunds' },
      { id: 'parse', label: 'Parse Alert' },
      { id: 'ingest', label: 'Ingest Alert' },
    ],
    activeTab: 'transactions',

    summary: { transaction_count: 0, total_debits: 0, total_credits: 0, pending_refunds: 0, pending_refund_value: 0, next_30_day_subscription_total: 0 },
    transactions: [],
    subscriptions: [],
    refunds: [],
    runway: [],

    txnSearch: '',
    txnDirection: '',
    txnStatus: '',

    parseText: '',
    parseResult: null,
    parseError: '',

    ingestText: '',
    ingestResult: null,
    ingestError: '',
    ingesting: false,

    showAddSubModal: false,
    subForm: { name: '', amount: '', currency: 'KES', billing_day: 1, fx_rate: 1 },

    init() {
      if (this.token) {
        this.loadData();
      }
    },

    getHeaders() {
      return this.token ? { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
    },

    formatNum(n) {
      if (n == null) return '0';
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    },

    ordinal(n) {
      if (n == null) return '';
      const s = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    },

    get filteredTransactions() {
      let items = this.transactions;
      if (this.txnSearch) {
        const q = this.txnSearch.toLowerCase();
        items = items.filter(t => (t.merchant || '').toLowerCase().includes(q) || (t.reference || '').toLowerCase().includes(q));
      }
      if (this.txnDirection) items = items.filter(t => t.direction === this.txnDirection);
      if (this.txnStatus) items = items.filter(t => t.status === this.txnStatus);
      return items;
    },

    async apiGet(path) {
      const r = await fetch(this.API_URL + path, { headers: this.getHeaders() });
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || 'Request failed'); }
      return r.json();
    },

    async apiPost(path, body) {
      const r = await fetch(this.API_URL + path, { method: 'POST', headers: this.getHeaders(), body: body ? JSON.stringify(body) : undefined });
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || 'Request failed'); }
      return r.json();
    },

    async login() {
      this.authError = '';
      try {
        const resp = await this.apiPost('/auth/login', { username: this.authForm.username, password: this.authForm.password });
        this.token = resp.access_token;
        this.username = this.authForm.username;
        localStorage.setItem('token', this.token);
        localStorage.setItem('username', this.username);
        this.authForm = { username: '', password: '', confirm: '' };
        this.loadData();
      } catch (e) {
        this.authError = e.message || 'Login failed';
      }
    },

    async register() {
      this.authError = '';
      if (this.authForm.password !== this.authForm.confirm) { this.authError = 'Passwords do not match'; return; }
      if (this.authForm.password.length < 6) { this.authError = 'Password must be at least 6 characters'; return; }
      try {
        await this.apiPost('/auth/register', { username: this.authForm.username, password: this.authForm.password });
        this.authError = '';
        this.authTab = 'login';
        this.authForm = { username: this.authForm.username, password: '', confirm: '' };
      } catch (e) {
        this.authError = e.message || 'Registration failed';
      }
    },

    async googleSignIn() {
      this.authError = '';
      if (typeof google === 'undefined' || !google.accounts?.oauth2) {
        this.authError = 'Google sign-in is not available. Try a different browser or disable ad blocker.';
        return;
      }
      try {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com',
          scope: 'openid email',
          callback: async (response) => {
            if (response.error) {
              this.authError = 'Google sign-in was cancelled or failed.';
              return;
            }
            if (response.id_token) {
              try {
                const resp = await this.apiPost('/auth/google', { id_token: response.id_token });
                this.token = resp.access_token;
                this.username = 'Google User';
                localStorage.setItem('token', this.token);
                localStorage.setItem('username', this.username);
                this.authForm = { username: '', password: '', confirm: '' };
                this.loadData();
              } catch (e) {
                this.authError = e.message || 'Google sign-in failed on server.';
              }
            }
          },
          error_callback: () => {
            this.authError = 'Google sign-in popup was blocked or failed.';
          },
        });
        client.requestAccessToken();
      } catch (e) {
        this.authError = 'Google sign-in failed: ' + (e.message || 'unknown error');
      }
    },

    logout() {
      this.token = '';
      this.username = '';
      localStorage.removeItem('token');
      localStorage.removeItem('username');
    },

    async loadData() {
      this.loading = true;
      this.apiError = '';
      try {
        const [summary, transactions, subscriptions, refunds, runway] = await Promise.all([
          this.apiGet('/summary'),
          this.apiGet('/transactions'),
          this.apiGet('/subscriptions'),
          this.apiGet('/refunds'),
          this.apiGet('/runway'),
        ]);
        this.summary = summary;
        this.transactions = transactions;
        this.subscriptions = subscriptions;
        this.refunds = refunds;
        this.runway = runway;
      } catch (e) {
        if (e.message.includes('401') || e.message.includes('Unauthorized')) {
          this.logout();
        } else {
          this.apiError = 'Failed to load data: ' + e.message + '. Make sure the FastAPI server is running on port 8000.';
        }
      } finally {
        this.loading = false;
      }
    },

    async refreshData() {
      this.ingestResult = null;
      this.ingestError = '';
      this.parseResult = null;
      this.parseError = '';
      await this.loadData();
    },

    async markRefund(txnId) {
      try {
        await this.apiPost('/transactions/' + txnId + '/refund', null);
        await this.loadData();
      } catch (e) {
        this.apiError = e.message || 'Failed to mark refund';
      }
    },

    async addSubscription() {
      try {
        await this.apiPost('/subscriptions', {
          name: this.subForm.name,
          amount: parseFloat(this.subForm.amount),
          currency: this.subForm.currency,
          billing_day: parseInt(this.subForm.billing_day),
          fx_rate: this.subForm.fx_rate ? parseFloat(this.subForm.fx_rate) : null,
        });
        this.subForm = { name: '', amount: '', currency: 'KES', billing_day: 1, fx_rate: 1 };
        await this.loadData();
      } catch (e) {
        this.apiError = e.message || 'Failed to add subscription';
      }
    },

    addSubscriptionFromModal() {
      this.showAddSubModal = false;
      this.addSubscription();
    },

    async previewParse() {
      this.parseResult = null;
      this.parseError = '';
      try {
        this.parseResult = await this.apiPost('/parse', { raw_text: this.parseText });
      } catch (e) {
        this.parseError = e.message || 'Failed to parse alert';
      }
    },

    async ingestAlert() {
      this.ingestResult = null;
      this.ingestError = '';
      this.ingesting = true;
      try {
        this.ingestResult = await this.apiPost('/transactions/ingest', { raw_text: this.ingestText });
        this.ingestText = '';
        this.loadData();
      } catch (e) {
        this.ingestError = e.message || 'Failed to ingest alert';
      } finally {
        this.ingesting = false;
      }
    },
  };
}
</script>
</body>
</html>
