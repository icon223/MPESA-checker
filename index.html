<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Safaricom One App Lite + Subscription Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
    .saf-gradient { background: linear-gradient(135deg, #009639 0%, #00b34a 50%, #4CBB17 100%); }
    .saf-bg { background: #009639; }
    .saf-text { color: #009639; }
    .saf-border { border-color: #009639; }
    .accent-red { color: #E31B23; }
    .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes countUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .anim-fade-in { animation: fadeIn 0.25s ease-out; }
    .anim-slide-up { animation: slideUp 0.3s ease-out; }
    .anim-count { animation: countUp 0.4s ease-out; }
    .pulse-dot { animation: pulse-dot 1.4s infinite; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .bottom-nav-btn { @apply flex flex-col items-center justify-center gap-0.5 py-1.5 px-3 rounded-xl transition-all duration-200 relative; }
    .bottom-nav-btn.active { @apply text-[#009639]; }
    .bottom-nav-btn.active::after { content: ''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; background: #009639; border-radius: 0 0 4px 4px; }
    .progress-bar { height: 6px; border-radius: 999px; background: #e5e7eb; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 999px; transition: width 0.6s ease; }
    .status-badge { @apply inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-semibold; }
    .sub-card { @apply rounded-xl border bg-white p-4 shadow-sm transition-all hover:shadow-md; }
  </style>
</head>
<body>

<div x-data="appState()" class="min-h-screen max-w-lg mx-auto relative" :class="{'overflow-hidden h-screen fixed inset-0': showModal || showPinModal || showReceipt || showSubModal}">

  <!-- ===== STICKY HEADER ===== -->
  <header class="sticky top-0 z-40 saf-gradient text-white px-4 pt-3 pb-4 shadow-lg">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
          <i data-lucide="smartphone" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <div class="text-sm font-bold leading-tight">Safaricom</div>
          <div class="text-[10px] text-white/80 font-medium -mt-0.5">One App Lite</div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button class="relative p-1.5">
          <i data-lucide="bell" class="w-5 h-5 text-white"></i>
          <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-[#E31B23] rounded-full border-2 border-[#009639] pulse-dot"></span>
        </button>
        <button class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center overflow-hidden">
          <i data-lucide="user" class="w-4.5 h-4.5 text-white"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="px-4 pb-28 space-y-4 -mt-2 hide-scrollbar">

    <!-- ============================ -->
    <!-- TAB 1: QUICK ACTIONS         -->
    <!-- ============================ -->
    <template x-if="activeTab === 'actions'">
      <div class="space-y-4">

        <!-- Balance Hero Card -->
        <div class="saf-gradient rounded-2xl p-5 text-white shadow-xl relative overflow-hidden anim-slide-up">
          <div class="absolute -top-8 -right-8 w-32 h-32 bg-white/5 rounded-full"></div>
          <div class="absolute -bottom-6 -left-6 w-28 h-28 bg-white/5 rounded-full"></div>
          <div class="absolute top-12 left-12 w-20 h-20 bg-white/[0.03] rounded-full"></div>
          <div class="relative z-10">
            <div class="flex items-center justify-between mb-1">
              <span class="text-white/80 text-xs font-medium uppercase tracking-wide">M-PESA Balance</span>
              <button @click="showBalance = !showBalance" class="text-white/70 hover:text-white transition">
                <i :data-lucide="showBalance ? 'eye-off' : 'eye'" class="w-4.5 h-4.5"></i>
              </button>
            </div>
            <div class="text-3xl font-bold tracking-tight mb-4 anim-count" x-text="showBalance ? 'KES ' + mpesaBalance.toLocaleString() : 'KES ****'"></div>
            <div class="grid grid-cols-3 gap-3">
              <div class="bg-white/15 rounded-xl p-2.5 text-center">
                <div class="text-[10px] text-white/70 font-medium">Airtime</div>
                <div class="text-sm font-bold" x-text="'KES ' + airtimeBalance"></div>
              </div>
              <div class="bg-white/15 rounded-xl p-2.5 text-center">
                <div class="text-[10px] text-white/70 font-medium">Data</div>
                <div class="text-sm font-bold" x-text="dataBalance + ' GB'"></div>
              </div>
              <div class="bg-white/15 rounded-xl p-2.5 text-center">
                <div class="text-[10px] text-white/70 font-medium">Bonga</div>
                <div class="text-sm font-bold" x-text="bongaPoints + ' pts'"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Quick Actions Grid -->
        <div>
          <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2.5 px-0.5">Quick Actions</div>
          <div class="grid grid-cols-2 gap-3">
            <template x-for="action in quickActions" :key="action.id">
              <button @click="openModal(action.id)" 
                class="glass-card border border-gray-100 rounded-2xl p-4 text-left shadow-sm hover:shadow-md transition-all active:scale-[0.97]">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-3" :style="'background:' + action.bg">
                  <i :data-lucide="action.icon" class="w-5.5 h-5.5" :style="'color:' + action.color"></i>
                </div>
                <div class="font-semibold text-gray-800 text-sm leading-tight" x-text="action.label"></div>
                <div class="text-[11px] text-gray-400 mt-0.5" x-text="action.sub"></div>
              </button>
            </template>
          </div>
        </div>

        <!-- Recent Activity -->
        <div>
          <div class="flex items-center justify-between mb-2.5 px-0.5">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Recent Activity</div>
          </div>
          <div class="space-y-2">
            <template x-for="txn in recentTransactions" :key="txn.id">
              <div class="glass-card border border-gray-100 rounded-xl px-4 py-3 flex items-center gap-3 shadow-sm">
                <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" :class="txn.type === 'send' ? 'bg-red-50' : txn.type === 'receive' ? 'bg-green-50' : 'bg-blue-50'">
                  <i :data-lucide="txn.icon" class="w-4.5 h-4.5" :class="txn.type === 'send' ? 'text-red-500' : txn.type === 'receive' ? 'text-green-600' : 'text-blue-600'"></i>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-semibold text-gray-800 truncate" x-text="txn.title"></div>
                  <div class="text-[11px] text-gray-400" x-text="txn.date"></div>
                </div>
                <div class="text-right shrink-0">
                  <div class="text-sm font-bold" :class="txn.type === 'send' ? 'text-red-500' : 'text-green-600'" x-text="(txn.type === 'send' ? '-KES ' : '+KES ') + txn.amount.toLocaleString()"></div>
                  <div class="text-[10px] text-gray-400 capitalize" x-text="txn.status"></div>
                </div>
              </div>
            </template>
          </div>
        </div>

      </div>
    </template>

    <!-- ============================ -->
    <!-- TAB 2: SUBSCRIPTION TRACKER  -->
    <!-- ============================ -->
    <template x-if="activeTab === 'subscriptions'">
      <div class="space-y-4 pt-1">

        <!-- Total Monthly Commitment -->
        <div class="rounded-2xl p-5 text-white shadow-xl relative overflow-hidden anim-slide-up" style="background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);">
          <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/5 rounded-full"></div>
          <div class="absolute -bottom-8 -left-8 w-32 h-32 bg-white/5 rounded-full"></div>
          <div class="relative z-10">
            <div class="text-white/70 text-[10px] font-semibold uppercase tracking-wider mb-0.5">Total Monthly Recurring</div>
            <div class="text-3xl font-bold tracking-tight" x-text="'KES ' + monthlyCommitment.toLocaleString()"></div>
            <div class="flex items-center gap-3 mt-3">
              <div class="bg-white/15 rounded-lg px-3 py-1.5 text-center">
                <div class="text-[10px] text-white/70">Active Subs</div>
                <div class="text-sm font-bold" x-text="activeSubCount"></div>
              </div>
              <div class="bg-white/15 rounded-lg px-3 py-1.5 text-center">
                <div class="text-[10px] text-white/70">Due This Week</div>
                <div class="text-sm font-bold" x-text="dueThisWeek"></div>
              </div>
              <div class="bg-white/15 rounded-lg px-3 py-1.5 text-center">
                <div class="text-[10px] text-white/70">Avg / Sub</div>
                <div class="text-sm font-bold" x-text="'KES ' + avgPerSub"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Alert Banner -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 flex items-start gap-3">
          <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-500 shrink-0 mt-0.5"></i>
          <div class="text-xs text-amber-800">
            <span class="font-semibold">Upcoming:</span> <span x-text="nextDueName"></span> renews in <span class="font-bold" x-text="nextDueDays"></span> days — <span x-text="'KES ' + nextDueAmount.toLocaleString()"></span>
          </div>
        </div>

        <!-- Subscriptions List -->
        <div>
          <div class="flex items-center justify-between mb-2.5 px-0.5">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Your Subscriptions</div>
            <button @click="openSubModal" class="text-xs font-bold text-[#009639] flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add New
            </button>
          </div>
          <div class="space-y-3">
            <template x-for="sub in subscriptions" :key="sub.id">
              <div class="sub-card relative overflow-hidden" :class="sub.status === 'due_soon' ? 'border-amber-200' : sub.status === 'paused' ? 'border-gray-200 opacity-70' : 'border-gray-100'">
                <!-- Status bar -->
                <div class="absolute top-0 left-0 right-0 h-1" :class="sub.status === 'active' ? 'bg-[#009639]' : sub.status === 'due_soon' ? 'bg-amber-400' : 'bg-gray-300'"></div>
                <div class="flex items-start justify-between">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold" :style="'background:' + sub.bg" :style="'color:' + sub.color" x-text="sub.icon"></div>
                    <div>
                      <div class="text-sm font-bold text-gray-800" x-text="sub.name"></div>
                      <div class="text-[11px] text-gray-400" x-text="'KES ' + sub.amount.toLocaleString() + '/mo ' + (sub.category ? '· ' + sub.category : '')"></div>
                    </div>
                  </div>
                  <div>
                    <span class="status-badge" :class="sub.status === 'active' ? 'bg-green-50 text-green-700' : sub.status === 'due_soon' ? 'bg-amber-50 text-amber-700' : 'bg-gray-100 text-gray-500'">
                      <span class="w-1.5 h-1.5 rounded-full" :class="sub.status === 'active' ? 'bg-green-500' : sub.status === 'due_soon' ? 'bg-amber-500' : 'bg-gray-400'"></span>
                      <span x-text="sub.status === 'active' ? 'Active' : sub.status === 'due_soon' ? 'Due Soon' : 'Paused'"></span>
                    </span>
                  </div>
                </div>
                <!-- Progress Bar -->
                <div class="mt-3">
                  <div class="flex items-center justify-between text-[10px] text-gray-400 mb-1">
                    <span x-text="sub.daysLeft + ' days left'"></span>
                    <span>Next: <span x-text="sub.nextDate"></span></span>
                  </div>
                  <div class="progress-bar">
                    <div class="progress-bar-fill" :class="sub.status === 'active' ? 'bg-[#009639]' : sub.status === 'due_soon' ? 'bg-amber-400' : 'bg-gray-300'" :style="'width:' + sub.progress + '%'"></div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Refund / Renewal Notes -->
        <div class="bg-blue-50 border border-blue-200 rounded-xl px-4 py-3 flex items-start gap-3">
          <i data-lucide="info" class="w-5 h-5 text-blue-500 shrink-0 mt-0.5"></i>
          <div class="text-xs text-blue-800">
            <span class="font-semibold">Refund Tracked:</span> KES 450 refund for <span class="font-semibold">YouTube Premium</span> is being processed. Expected settlement within 3-7 days.
          </div>
        </div>

      </div>
    </template>

  </main>

  <!-- ===== BOTTOM NAVIGATION ===== -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-gray-200 shadow-2xl" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
    <div class="max-w-lg mx-auto flex items-center justify-around px-4 py-1.5">
      <button @click="activeTab = 'actions'" class="bottom-nav-btn" :class="activeTab === 'actions' ? 'active' : 'text-gray-400'">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Quick Actions</span>
      </button>
      <button @click="activeTab = 'subscriptions'" class="bottom-nav-btn" :class="activeTab === 'subscriptions' ? 'active' : 'text-gray-400'">
        <i data-lucide="credit-card" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Subscriptions</span>
      </button>
    </div>
  </nav>

  <!-- ===== ACTION MODALS ===== -->
  <template x-if="showModal">
    <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center modal-overlay" @click.self="closeModal">
      <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[85vh] overflow-y-auto shadow-2xl anim-slide-up" @click.stop>
        <div class="sticky top-0 bg-white z-10 flex items-center justify-between px-5 pt-4 pb-3 border-b border-gray-100">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center" :style="'background:' + currentAction.bg">
              <i :data-lucide="currentAction.icon" class="w-5 h-5" :style="'color:' + currentAction.color"></i>
            </div>
            <div>
              <div class="font-bold text-gray-800 text-sm" x-text="currentAction.label"></div>
              <div class="text-[10px] text-gray-400" x-text="currentAction.sub"></div>
            </div>
          </div>
          <button @click="closeModal" class="p-1.5 hover:bg-gray-100 rounded-full transition">
            <i data-lucide="x" class="w-5 h-5 text-gray-400"></i>
          </button>
        </div>
        <div class="p-5 space-y-4">

          <!-- Send Money -->
          <template x-if="modalType === 'send'">
            <div class="space-y-4">
              <div>
                <label class="text-xs font-semibold text-gray-500 block mb-1.5">To (Phone Number)</label>
                <div class="relative">
                  <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm font-semibold text-gray-400">+254</span>
                  <input type="tel" x-model="sendForm.phone" placeholder="712 345 678" maxlength="9"
                    class="w-full pl-14 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
                </div>
              </div>
              <div>
                <label class="text-xs font-semibold text-gray-500 block mb-1.5">Amount (KES)</label>
                <input type="number" x-model="sendForm.amount" placeholder="0.00" min="1"
                  class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
              </div>
              <div class="flex gap-2">
                <template x-for="amt in [50, 100, 500, 1000]" :key="amt">
                  <button @click="sendForm.amount = amt" 
                    class="flex-1 py-2.5 rounded-xl text-xs font-semibold border transition"
                    :class="sendForm.amount == amt ? 'bg-[#009639] text-white border-[#009639]' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'">
                    KES <span x-text="amt.toLocaleString()"></span>
                  </button>
                </template>
              </div>
              <button @click="confirmSend" :disabled="!sendForm.phone || !sendForm.amount"
                class="w-full py-3.5 rounded-xl font-bold text-sm text-white transition disabled:opacity-40"
                :class="sendForm.phone && sendForm.amount ? 'saf-gradient hover:shadow-lg active:scale-[0.98]' : 'bg-gray-300'">
                Send KES <span x-text="Number(sendForm.amount).toLocaleString()"></span>
              </button>
            </div>
          </template>

          <!-- Lipa Na M-PESA -->
          <template x-if="modalType === 'lipa'">
            <div class="space-y-4">
              <div class="flex bg-gray-100 rounded-xl p-1">
                <button @click="lipaTab = 'till'" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition"
                  :class="lipaTab === 'till' ? 'bg-white text-[#009639] shadow-sm' : 'text-gray-500'">Buy Goods & Services</button>
                <button @click="lipaTab = 'paybill'" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition"
                  :class="lipaTab === 'paybill' ? 'bg-white text-[#009639] shadow-sm' : 'text-gray-500'">Paybill</button>
              </div>
              <template x-if="lipaTab === 'till'">
                <div class="space-y-4">
                  <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1.5">Till Number</label>
                    <input type="tel" x-model="lipaForm.till" placeholder="e.g. 987654" maxlength="7"
                      class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
                  </div>
                  <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1.5">Amount (KES)</label>
                    <input type="number" x-model="lipaForm.amount" placeholder="0.00" min="1"
                      class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
                  </div>
                </div>
              </template>
              <template x-if="lipaTab === 'paybill'">
                <div class="space-y-4">
                  <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1.5">Business Number</label>
                    <input type="tel" x-model="lipaForm.paybill" placeholder="e.g. 247247" maxlength="7"
                      class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
                  </div>
                  <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1.5">Account Number (Optional)</label>
                    <input type="text" x-model="lipaForm.account" placeholder="e.g. 1234567890"
                      class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
                  </div>
                  <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1.5">Amount (KES)</label>
                    <input type="number" x-model="lipaForm.amount" placeholder="0.00" min="1"
                      class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
                  </div>
                </div>
              </template>
              <button @click="confirmLipa" :disabled="!lipaForm.amount || (lipaTab === 'till' && !lipaForm.till) || (lipaTab === 'paybill' && !lipaForm.paybill)"
                class="w-full py-3.5 rounded-xl font-bold text-sm text-white transition disabled:opacity-40"
                :class="lipaForm.amount && ((lipaTab === 'till' && lipaForm.till) || (lipaTab === 'paybill' && lipaForm.paybill)) ? 'saf-gradient hover:shadow-lg active:scale-[0.98]' : 'bg-gray-300'">
                Pay KES <span x-text="Number(lipaForm.amount).toLocaleString()"></span>
              </button>
            </div>
          </template>

          <!-- Buy Bundles -->
          <template x-if="modalType === 'bundles'">
            <div class="space-y-4">
              <div class="flex bg-gray-100 rounded-xl p-1">
                <button @click="bundleTab = 'data'" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition"
                  :class="bundleTab === 'data' ? 'bg-white text-[#009639] shadow-sm' : 'text-gray-500'">Data</button>
                <button @click="bundleTab = 'minutes'" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition"
                  :class="bundleTab === 'minutes' ? 'bg-white text-[#009639] shadow-sm' : 'text-gray-500'">Minutes</button>
                <button @click="bundleTab = 'tunukiwa'" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition"
                  :class="bundleTab === 'tunukiwa' ? 'bg-white text-[#009639] shadow-sm' : 'text-gray-500'">Tunukiwa</button>
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                <template x-for="bundle in filteredBundles" :key="bundle.id">
                  <button @click="selectedBundle = bundle.id" 
                    class="rounded-xl p-3.5 text-left border transition"
                    :class="selectedBundle === bundle.id ? 'border-[#009639] bg-green-50' : 'border-gray-200 bg-gray-50'">
                    <div class="text-sm font-bold text-gray-800" x-text="bundle.label"></div>
                    <div class="text-[11px] text-gray-400 mt-0.5" x-text="bundle.desc"></div>
                    <div class="text-xs font-bold text-[#009639] mt-1.5">KES <span x-text="bundle.price"></span></div>
                  </button>
                </template>
              </div>
              <button @click="confirmBundle" :disabled="!selectedBundle"
                class="w-full py-3.5 rounded-xl font-bold text-sm text-white transition disabled:opacity-40"
                :class="selectedBundle ? 'saf-gradient hover:shadow-lg active:scale-[0.98]' : 'bg-gray-300'">
                Buy Bundle
              </button>
            </div>
          </template>

          <!-- Top Up Airtime -->
          <template x-if="modalType === 'airtime'">
            <div class="space-y-4">
              <div class="flex bg-gray-100 rounded-xl p-1">
                <button @click="airtimeTab = 'self'" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition"
                  :class="airtimeTab === 'self' ? 'bg-white text-[#009639] shadow-sm' : 'text-gray-500'">My Number</button>
                <button @click="airtimeTab = 'other'" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition"
                  :class="airtimeTab === 'other' ? 'bg-white text-[#009639] shadow-sm' : 'text-gray-500'">Other Number</button>
              </div>
              <template x-if="airtimeTab === 'other'">
                <div>
                  <label class="text-xs font-semibold text-gray-500 block mb-1.5">Phone Number</label>
                  <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm font-semibold text-gray-400">+254</span>
                    <input type="tel" x-model="airtimeForm.phone" placeholder="712 345 678" maxlength="9"
                      class="w-full pl-14 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
                  </div>
                </div>
              </template>
              <div>
                <label class="text-xs font-semibold text-gray-500 block mb-1.5">Amount (KES)</label>
                <input type="number" x-model="airtimeForm.amount" placeholder="0.00" min="1"
                  class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
              </div>
              <div class="flex gap-2">
                <template x-for="amt in [10, 20, 50, 100]" :key="amt">
                  <button @click="airtimeForm.amount = amt" 
                    class="flex-1 py-2.5 rounded-xl text-xs font-semibold border transition"
                    :class="airtimeForm.amount == amt ? 'bg-[#009639] text-white border-[#009639]' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'">
                    KES <span x-text="amt"></span>
                  </button>
                </template>
              </div>
              <button @click="confirmAirtime" :disabled="!airtimeForm.amount || (airtimeTab === 'other' && !airtimeForm.phone)"
                class="w-full py-3.5 rounded-xl font-bold text-sm text-white transition disabled:opacity-40"
                :class="airtimeForm.amount && (airtimeTab === 'self' || airtimeForm.phone) ? 'saf-gradient hover:shadow-lg active:scale-[0.98]' : 'bg-gray-300'">
                Buy KES <span x-text="Number(airtimeForm.amount).toLocaleString()"></span> Airtime
              </button>
            </div>
          </template>

        </div>
      </div>
    </div>
  </template>

  <!-- ===== ADD SUBSCRIPTION MODAL ===== -->
  <template x-if="showSubModal">
    <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center modal-overlay" @click.self="showSubModal = false">
      <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-lg shadow-2xl anim-slide-up" @click.stop>
        <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-gray-100">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center bg-blue-50">
              <i data-lucide="credit-card" class="w-5 h-5 text-blue-600"></i>
            </div>
            <div>
              <div class="font-bold text-gray-800 text-sm">Add Subscription</div>
              <div class="text-[10px] text-gray-400">Track a new recurring expense</div>
            </div>
          </div>
          <button @click="showSubModal = false" class="p-1.5 hover:bg-gray-100 rounded-full transition">
            <i data-lucide="x" class="w-5 h-5 text-gray-400"></i>
          </button>
        </div>
        <div class="p-5 space-y-4">
          <div>
            <label class="text-xs font-semibold text-gray-500 block mb-1.5">Service Name</label>
            <input type="text" x-model="subForm.name" placeholder="e.g. Netflix, Spotify"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500 block mb-1.5">Amount (KES/month)</label>
            <input type="number" x-model="subForm.amount" placeholder="0.00" min="1"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500 block mb-1.5">Billing Cycle</label>
            <select x-model="subForm.cycle"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition appearance-none">
              <option value="monthly">Monthly</option>
              <option value="quarterly">Quarterly (every 3 months)</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500 block mb-1.5">Category</label>
            <select x-model="subForm.category"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#009639]/30 focus:border-[#009639] transition appearance-none">
              <option value="Entertainment">Entertainment</option>
              <option value="Internet">Internet / Wi-Fi</option>
              <option value="Insurance">Insurance</option>
              <option value="Cloud Storage">Cloud Storage</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <button @click="addSubscription" :disabled="!subForm.name || !subForm.amount"
            class="w-full py-3.5 rounded-xl font-bold text-sm text-white transition disabled:opacity-40"
            :class="subForm.name && subForm.amount ? 'saf-gradient hover:shadow-lg active:scale-[0.98]' : 'bg-gray-300'">
            Add to Tracker
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== PIN MODAL ===== -->
  <template x-if="showPinModal">
    <div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay" @click.self="showPinModal = false">
      <div class="bg-white rounded-2xl w-[320px] shadow-2xl anim-fade-in p-6" @click.stop>
        <div class="text-center mb-5">
          <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Hakikisha — Enter PIN</div>
          <div class="text-lg font-bold text-gray-800 mt-1" x-text="'KES ' + pendingAmount.toLocaleString()"></div>
          <div class="text-sm text-gray-500" x-text="'to ' + pendingRecipient"></div>
        </div>
        <div class="flex justify-center gap-3 mb-5">
          <template x-for="i in 4" :key="i">
            <div class="w-4 h-4 rounded-full border-2 transition" :class="pin.length >= i ? 'border-[#009639] bg-[#009639]' : 'border-gray-300'"></div>
          </template>
        </div>
        <div class="grid grid-cols-3 gap-2.5">
          <template x-for="n in [1,2,3,4,5,6,7,8,9]" :key="n">
            <button @click="pinInput(n)" class="py-3.5 rounded-xl text-lg font-bold text-gray-800 bg-gray-50 hover:bg-gray-100 active:bg-gray-200 transition"> <span x-text="n"></span> </button>
          </template>
          <button @click="pinInput('clear')" class="py-3.5 rounded-xl text-xs font-semibold text-gray-500 bg-gray-50 hover:bg-gray-100 active:bg-gray-200 transition">Clear</button>
          <button @click="pinInput(0)" class="py-3.5 rounded-xl text-lg font-bold text-gray-800 bg-gray-50 hover:bg-gray-100 active:bg-gray-200 transition">0</button>
          <button @click="pinSubmit" class="py-3.5 rounded-xl text-xs font-bold text-white saf-gradient hover:shadow-lg transition" :class="pin.length < 4 ? 'opacity-40' : ''">OK</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== RECEIPT MODAL ===== -->
  <template x-if="showReceipt">
    <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center modal-overlay" @click.self="showReceipt = false">
      <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-lg shadow-2xl p-6 anim-slide-up" @click.stop>
        <div class="text-center mb-5">
          <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <i data-lucide="check-circle" class="w-9 h-9 text-[#009639]"></i>
          </div>
          <div class="text-lg font-bold text-gray-800">Transaction Successful</div>
          <div class="text-[11px] text-gray-400 mt-0.5">Hakikisha confirmed</div>
        </div>
        <div class="bg-gray-50 rounded-xl p-4 space-y-2.5 mb-5">
          <div class="flex justify-between text-sm" x-show="receiptData.type">
            <span class="text-gray-500">Type</span>
            <span class="font-semibold text-gray-800 capitalize" x-text="receiptData.type"></span>
          </div>
          <div class="flex justify-between text-sm" x-show="receiptData.to">
            <span class="text-gray-500">To</span>
            <span class="font-semibold text-gray-800" x-text="receiptData.to"></span>
          </div>
          <div class="flex justify-between text-sm" x-show="receiptData.amount">
            <span class="text-gray-500">Amount</span>
            <span class="font-bold text-gray-800" x-text="'KES ' + Number(receiptData.amount).toLocaleString()"></span>
          </div>
          <div class="flex justify-between text-sm" x-show="receiptData.reference">
            <span class="text-gray-500">Ref</span>
            <span class="font-mono text-xs font-semibold text-gray-800" x-text="receiptData.reference"></span>
          </div>
          <div class="flex justify-between text-sm" x-show="receiptData.fee">
            <span class="text-gray-500">Fee</span>
            <span class="font-semibold text-gray-800" x-text="'KES ' + receiptData.fee"></span>
          </div>
          <div class="flex justify-between text-sm" x-show="receiptData.balance">
            <span class="text-gray-500">New Balance</span>
            <span class="font-bold text-[#009639]" x-text="'KES ' + Number(receiptData.balance).toLocaleString()"></span>
          </div>
        </div>
        <button @click="closeAllModals" class="w-full py-3.5 rounded-xl font-bold text-sm text-white saf-gradient hover:shadow-lg active:scale-[0.98] transition">Done</button>
      </div>
    </div>
  </template>

</div>

<script>
function appState() {
  return {
    // Tab
    activeTab: 'actions',

    // Balance
    showBalance: true,
    mpesaBalance: 4520,
    airtimeBalance: 124,
    dataBalance: 3.2,
    bongaPoints: 2480,

    // Modal state
    showModal: false,
    showPinModal: false,
    showReceipt: false,
    showSubModal: false,
    modalType: null,
    pin: '',
    pendingAction: null,
    pendingAmount: 0,
    pendingRecipient: '',

    receiptData: {},

    // Quick Actions
    quickActions: [
      { id: 'send',    label: 'Send Money',        sub: 'To any M-PESA number',    icon: 'send',       bg: '#e8f5e9', color: '#009639' },
      { id: 'lipa',    label: 'Lipa Na M-PESA',    sub: 'Buy goods or Paybill',     icon: 'shopping-cart', bg: '#fff3e0', color: '#e65100' },
      { id: 'bundles', label: 'Buy Bundles',       sub: 'Data, mins & Tunukiwa',    icon: 'wifi',       bg: '#e3f2fd', color: '#1565c0' },
      { id: 'airtime', label: 'Top Up Airtime',    sub: 'My number or other',       icon: 'smartphone', bg: '#fce4ec', color: '#c62828' },
    ],

    currentAction: { icon: 'send', label: '', sub: '', bg: '', color: '' },

    // Form state
    sendForm: { phone: '', amount: '' },
    lipaForm: { till: '', paybill: '', account: '', amount: '' },
    airtimeForm: { phone: '', amount: '' },
    lipaTab: 'till',
    bundleTab: 'data',
    airtimeTab: 'self',
    selectedBundle: null,
    bundles: [],

    // Subscription form
    subForm: { name: '', amount: '', cycle: 'monthly', category: 'Entertainment' },

    // Subscriptions
    subscriptions: [],

    // Transactions
    recentTransactions: [],
    txnIdCounter: 5,
    subIdCounter: 4,

    init() {
      this.loadBundles();
      this.loadSubscriptions();
      this.loadTransactions();
      document.addEventListener('alpine:init', () => { lucide.createIcons(); });
      this.$nextTick(() => { lucide.createIcons(); });
      this.$watch('showModal', () => { this.$nextTick(() => { lucide.createIcons(); }); });
      this.$watch('showPinModal', () => { this.$nextTick(() => { lucide.createIcons(); }); });
      this.$watch('showReceipt', () => { this.$nextTick(() => { lucide.createIcons(); }); });
      this.$watch('showSubModal', () => { this.$nextTick(() => { lucide.createIcons(); }); });
      this.$watch('activeTab', () => { this.$nextTick(() => { lucide.createIcons(); }); });
    },

    // ===== COMPUTED =====
    get filteredBundles() {
      return this.bundles.filter(b => b.type === this.bundleTab);
    },

    get monthlyCommitment() {
      return this.subscriptions.reduce((sum, s) => sum + (s.status !== 'paused' ? s.amount : 0), 0);
    },

    get activeSubCount() {
      return this.subscriptions.filter(s => s.status !== 'paused').length;
    },

    get dueThisWeek() {
      return this.subscriptions.filter(s => s.daysLeft <= 7 && s.status !== 'paused').length;
    },

    get avgPerSub() {
      const active = this.subscriptions.filter(s => s.status !== 'paused');
      if (!active.length) return 0;
      return Math.round(this.monthlyCommitment / active.length);
    },

    get nextDueName() {
      const upcoming = this.subscriptions.filter(s => s.status !== 'paused').sort((a, b) => a.daysLeft - b.daysLeft);
      return upcoming.length ? upcoming[0].name : '—';
    },

    get nextDueDays() {
      const upcoming = this.subscriptions.filter(s => s.status !== 'paused').sort((a, b) => a.daysLeft - b.daysLeft);
      return upcoming.length ? upcoming[0].daysLeft : '—';
    },

    get nextDueAmount() {
      const upcoming = this.subscriptions.filter(s => s.status !== 'paused').sort((a, b) => a.daysLeft - b.daysLeft);
      return upcoming.length ? upcoming[0].amount : 0;
    },

    // ===== DATA LOADING =====
    loadBundles() {
      this.bundles = [
        { id: 'd1', label: '1 GB', desc: '30 days validity', price: 300, type: 'data' },
        { id: 'd2', label: '3 GB', desc: '30 days validity', price: 500, type: 'data' },
        { id: 'd3', label: '10 GB', desc: '30 days validity', price: 1000, type: 'data' },
        { id: 'd4', label: '20 GB', desc: '30 days validity', price: 1500, type: 'data' },
        { id: 'm1', label: '30 Mins', desc: 'All network, 1 day', price: 99, type: 'minutes' },
        { id: 'm2', label: '100 Mins', desc: 'All network, 7 days', price: 299, type: 'minutes' },
        { id: 'm3', label: '300 Mins', desc: 'All network, 30 days', price: 799, type: 'minutes' },
        { id: 't1', label: '1GB + 30Mins', desc: 'Tunukiwa daily', price: 350, type: 'tunukiwa' },
        { id: 't2', label: '3GB + 100Mins', desc: 'Tunukiwa weekly', price: 599, type: 'tunukiwa' },
        { id: 't3', label: '10GB + 300Mins', desc: 'Tunukiwa monthly', price: 1299, type: 'tunukiwa' },
      ];
    },

    loadSubscriptions() {
      const today = new Date();
      const toDate = (d) => d.toLocaleDateString('en-KE', { month: 'short', day: 'numeric' });

      const d1 = new Date(today); d1.setDate(d1.getDate() + 5);
      const d2 = new Date(today); d2.setDate(d2.getDate() + 12);
      const d3 = new Date(today); d3.setDate(d3.getDate() + 2);
      const d4 = new Date(today); d4.setDate(d4.getDate() + 18);

      this.subscriptions = [
        {
          id: 1, name: 'YouTube Premium (Family)', amount: 1350, icon: 'YT', bg: '#fce4ec', color: '#c62828',
          category: 'Entertainment', status: 'active', daysLeft: 5, nextDate: toDate(d1), progress: 83,
        },
        {
          id: 2, name: 'Apple Music', amount: 450, icon: 'AM', bg: '#fce4ec', color: '#d32f2f',
          category: 'Entertainment', status: 'due_soon', daysLeft: 2, nextDate: toDate(d3), progress: 93,
        },
        {
          id: 3, name: 'Zuku Fiber Internet', amount: 3500, icon: 'ZF', bg: '#e3f2fd', color: '#1565c0',
          category: 'Internet', status: 'active', daysLeft: 12, nextDate: toDate(d2), progress: 60,
        },
        {
          id: 4, name: 'Netflix Mobile', amount: 1100, icon: 'N', bg: '#fce4ec', color: '#b71c1c',
          category: 'Entertainment', status: 'active', daysLeft: 18, nextDate: toDate(d4), progress: 40,
        },
      ];
    },

    loadTransactions() {
      this.recentTransactions = [
        { id: 1, type: 'send', icon: 'arrow-up-right', title: 'Sent to John K.', amount: 1500, date: 'Today, 2:30 PM', status: 'Completed' },
        { id: 2, type: 'receive', icon: 'arrow-down-left', title: 'Received from Mary W.', amount: 3200, date: 'Today, 11:15 AM', status: 'Completed' },
        { id: 3, type: 'bundle', icon: 'wifi', title: 'Data Bundle - 1GB', amount: 300, date: 'Yesterday, 6:00 PM', status: 'Completed' },
        { id: 4, type: 'send', icon: 'shopping-cart', title: 'Lipa - Quickmart Juja', amount: 845, date: 'Yesterday, 4:20 PM', status: 'Completed' },
      ];
    },

    // ===== MODAL CONTROLS =====
    openModal(type) {
      this.modalType = type;
      this.currentAction = this.quickActions.find(a => a.id === type) || this.currentAction;
      this.showModal = true;
    },

    closeModal() {
      this.showModal = false;
      this.resetForms();
    },

    resetForms() {
      this.sendForm = { phone: '', amount: '' };
      this.lipaForm = { till: '', paybill: '', account: '', amount: '' };
      this.airtimeForm = { phone: '', amount: '' };
      this.lipaTab = 'till';
      this.bundleTab = 'data';
      this.airtimeTab = 'self';
      this.selectedBundle = null;
    },

    openSubModal() {
      this.subForm = { name: '', amount: '', cycle: 'monthly', category: 'Entertainment' };
      this.showSubModal = true;
    },

    addSubscription() {
      if (!this.subForm.name || !this.subForm.amount) return;
      const today = new Date();
      const due = new Date(today); due.setDate(due.getDate() + 25);
      const iconLabel = this.subForm.name.split(/\s+/).map(w => w[0]).join('').substring(0, 2).toUpperCase();
      const catColors = { Entertainment: { bg: '#fce4ec', color: '#c62828' }, Internet: { bg: '#e3f2fd', color: '#1565c0' }, Insurance: { bg: '#fff3e0', color: '#e65100' }, 'Cloud Storage': { bg: '#e8f5e9', color: '#009639' }, Other: { bg: '#f3e5f5', color: '#7b1fa2' } };
      const color = catColors[this.subForm.category] || { bg: '#f3e5f5', color: '#7b1fa2' };

      this.subscriptions.push({
        id: this.subIdCounter++,
        name: this.subForm.name,
        amount: Number(this.subForm.amount),
        icon: iconLabel,
        bg: color.bg,
        color: color.color,
        category: this.subForm.category,
        status: 'active',
        daysLeft: 25,
        nextDate: due.toLocaleDateString('en-KE', { month: 'short', day: 'numeric' }),
        progress: 17,
      });

      this.showSubModal = false;
      this.subForm = { name: '', amount: '', cycle: 'monthly', category: 'Entertainment' };
    },

    // ===== PIN & ACTIONS =====
    confirmSend() {
      this.pendingAction = 'send';
      this.pendingAmount = Number(this.sendForm.amount);
      this.pendingRecipient = '07' + this.sendForm.phone;
      this.showModal = false;
      this.$nextTick(() => { this.showPinModal = true; lucide.createIcons(); });
    },

    confirmLipa() {
      this.pendingAction = 'lipa';
      this.pendingAmount = Number(this.lipaForm.amount);
      this.pendingRecipient = this.lipaTab === 'till' ? 'Till ' + this.lipaForm.till : 'Paybill ' + this.lipaForm.paybill;
      this.showModal = false;
      this.$nextTick(() => { this.showPinModal = true; lucide.createIcons(); });
    },

    confirmBundle() {
      const bundle = this.bundles.find(b => b.id === this.selectedBundle);
      this.pendingAction = 'bundle';
      this.pendingAmount = Number(bundle.price);
      this.pendingRecipient = bundle.label;
      this.showModal = false;
      this.$nextTick(() => { this.showPinModal = true; lucide.createIcons(); });
    },

    confirmAirtime() {
      this.pendingAction = 'airtime';
      this.pendingAmount = Number(this.airtimeForm.amount);
      this.pendingRecipient = this.airtimeTab === 'self' ? 'My Number' : '07' + this.airtimeForm.phone;
      this.showModal = false;
      this.$nextTick(() => { this.showPinModal = true; lucide.createIcons(); });
    },

    pinInput(val) {
      if (val === 'clear') { this.pin = ''; return; }
      if (this.pin.length < 4) this.pin += val;
    },

    pinSubmit() {
      if (this.pin.length < 4) return;
      this.showPinModal = false;
      this.pin = '';
      this.executeAction();
    },

    executeAction() {
      const ref = 'QF' + Math.random().toString(36).substring(2, 8).toUpperCase();
      const fee = this.pendingAmount >= 1000 ? 35 : 0;
      const total = this.pendingAmount + fee;
      this.mpesaBalance -= total;
      this.mpesaBalance = Math.max(0, this.mpesaBalance);

      const txn = { id: this.txnIdCounter++, type: 'send', icon: 'arrow-up-right', title: '', amount: this.pendingAmount, date: 'Just now', status: 'Completed' };

      this.receiptData = {
        type: this.pendingAction === 'send' ? 'Send Money' : this.pendingAction === 'lipa' ? 'Lipa Na M-PESA' : this.pendingAction === 'bundle' ? 'Bundle Purchase' : 'Airtime Top Up',
        to: this.pendingRecipient, amount: this.pendingAmount, reference: ref, fee: fee, balance: this.mpesaBalance,
      };

      switch(this.pendingAction) {
        case 'send':    txn.title = 'Sent to ' + this.pendingRecipient; break;
        case 'lipa':    txn.title = 'Paid to ' + this.pendingRecipient; txn.icon = 'shopping-cart'; break;
        case 'bundle':  txn.title = 'Bundle - ' + this.pendingRecipient; txn.icon = 'wifi'; break;
        case 'airtime': txn.title = 'Airtime - ' + this.pendingRecipient; this.airtimeBalance += this.pendingAmount; break;
      }

      this.recentTransactions.unshift(txn);
      this.$nextTick(() => { this.showReceipt = true; lucide.createIcons(); });
    },

    closeAllModals() {
      this.showReceipt = false;
      this.showPinModal = false;
      this.showModal = false;
      this.showSubModal = false;
      this.pin = '';
      this.resetForms();
    },
  };
}
</script>
</body>
</html>
